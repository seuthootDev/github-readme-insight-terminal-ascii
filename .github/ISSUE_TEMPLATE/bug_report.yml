name: Bug report
description: A card looks wrong, shows an error, or the builder misbehaves
labels: ["bug"]
body:
  - type: input
    id: url
    attributes:
      label: Card URL
      description: The full image URL that shows the problem.
      placeholder: https://github-readme-insight-terminal-asci.vercel.app/svg/stats?user=...&theme=mac
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you see, and what you expected instead. A screenshot helps.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where do you see it?
      options:
        - In a GitHub README
        - Opening the URL directly in a browser
        - In the card builder
        - Self-hosted instance
        - CLI (npx)
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Browser, light/dark GitHub theme, self-hosting setup, ...
