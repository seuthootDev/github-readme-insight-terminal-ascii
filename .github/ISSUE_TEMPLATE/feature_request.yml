name: Feature request
description: A new option, a card improvement, or something that would make the cards easier to use
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like?
      description: What you're trying to do, and what's missing or awkward today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: A query parameter, an example URL, a sketch or a screenshot, whatever helps.
  - type: checkboxes
    id: pr
    attributes:
      label: Contributing
      options:
        - label: I'd like to open a PR for this myself
